<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دعوة زفاف — السيد و الاء</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Background music: put your file next to this page as wedding-music.mp3 -->
    <audio id="music" src="wedding-music.mp3" loop preload="auto"></audio>

    <div class="stage">
      <!-- Music toggle -->
      <button id="musicBtn" class="music-btn" aria-label="تشغيل الموسيقى">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V6l10-2v12" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="16" cy="16" r="3" />
          <path id="musicSlash" d="M3 3l18 18" />
        </svg>
      </button>

      <!-- Slides -->
      <div class="slides" id="slides">
        <!-- Slide 1: open -->
        <section class="slide" data-slide="0">
          <img src="images/open.png" alt="افتح الدعوة" />
          <button class="cta cta-center" data-next style="top:calc(72% - 20px); left:50%">
            <span class="spark">✦</span>
            <span>افتح الدعوة</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          </button>
        </section>

        <!-- Slide 2: names -->
        <section class="slide" data-slide="1">
          <img src="images/names.png" alt="السيد و الاء" />
          <button class="cta cta-bottom" data-next >
            <span class="spark">✦</span>
            <span>متابعة</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l-6 6 6 6M4 12h16"/></svg>
          </button>
        </section>

        <!-- Slide 3: details -->
        <section class="slide" data-slide="2">
          <img src="images/details.png" alt="تفاصيل الحفل" />
          <div class="countdown" id="countdown">
            <div class="count-box"><span class="num" data-days>٠٠</span><span class="lbl">أيام</span></div>
            <div class="count-box"><span class="num" data-hours>٠٠</span><span class="lbl">ساعات</span></div>
            <div class="count-box"><span class="num" data-mins>٠٠</span><span class="lbl">دقائق</span></div>
            <div class="count-box"><span class="num" data-secs>٠٠</span><span class="lbl">ثواني</span></div>
          </div>
          <a class="cta cta-venue" id="venue"
            href="https://www.google.com/maps/search/?api=1&query=volnvilla"
            target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span>موقع القاعة</span>
          </a>
          <button class="cta cta-restart" data-go="0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>
            <span>الرجوع لأول صفحة</span>
          </button>
        </section>
      </div>

      <!-- Step dots -->
      <div class="dots" id="dots">
        <button class="dot" data-go="0" aria-label="الخطوة ١"></button>
        <button class="dot" data-go="1" aria-label="الخطوة ٢"></button>
        <button class="dot" data-go="2" aria-label="الخطوة ٣"></button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
